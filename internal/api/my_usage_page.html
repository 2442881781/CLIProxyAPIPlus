<!DOCTYPE html>
<html lang="zh-CN" data-theme="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>用量面板</title>
<style>
:root,[data-theme="white"]{
  --bg:#f5f4f1;--card:#ffffff;--card2:#faf9f7;--border:#e6e2dc;--border-hover:#cfc9c0;
  --text:#1d1b18;--text2:#5a544d;--text3:#9c958d;
  --primary:#4a453f;--primary-hover:#37332e;
  --success:#0d9668;--error:#c65746;--warn:#b45309;
}
[data-theme="dark"]{
  --bg:#151412;--card:#1d1b18;--card2:#262320;--border:#3a3530;--border-hover:#5a544d;
  --text:#f6f4f1;--text2:#c9c3bb;--text3:#9c958d;
  --primary:#8b8680;--primary-hover:#9a948e;
  --success:#10b981;--error:#c65746;--warn:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:40px 20px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:24px;font-weight:600}
.sub{color:var(--text3);font-size:13px;margin-top:6px;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat .label{font-size:12px;color:var(--text3);margin-bottom:6px}
.stat .value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .extra{font-size:12px;color:var(--text3);margin-top:4px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500}
.tag.ok{background:rgba(16,185,129,.15);color:var(--success)}
.tag.off{background:rgba(156,149,141,.18);color:var(--text3)}
.tag.bad{background:rgba(198,87,70,.15);color:var(--error)}
.bar{height:8px;border-radius:999px;background:var(--card2);border:1px solid var(--border);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--success);border-radius:999px;transition:width .4s}
.bar.warn>i{background:var(--warn)}
.bar.over>i{background:var(--error)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.row:last-child{border-bottom:none}
.row .k{color:var(--text3)}
.row .v{text-align:right;word-break:break-all}
.muted{color:var(--text3)}
.center{text-align:center;padding:60px 0}
input[type=text]{width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:14px;outline:none}
input[type=text]:focus{border-color:var(--border-hover)}
button{padding:10px 20px;border:none;border-radius:8px;background:var(--primary);color:var(--card);font-size:14px;cursor:pointer;font-weight:500}
button:hover{background:var(--primary-hover)}
h2{font-size:15px;font-weight:600;margin-bottom:12px}
.err{background:rgba(198,87,70,.1);border:1px solid var(--error);color:var(--error);padding:12px 16px;border-radius:8px;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:7px 14px;font-size:13px;font-weight:500;background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.tabs button.active{background:var(--primary);color:var(--card);border-color:var(--primary)}
.step{font-size:13px;color:var(--text2);margin:16px 0 7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step:first-of-type{margin-top:0}
.step code{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-size:12px;color:var(--text)}
.codeblock{position:relative;background:var(--card2);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.codeblock pre{margin:0;padding:13px 15px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;overflow-x:auto;white-space:pre;color:var(--text)}
.codeblock .copy{position:absolute;top:8px;right:8px;padding:5px 11px;font-size:12px;background:var(--card);color:var(--text2);border:1px solid var(--border)}
.codeblock .copy:hover{background:var(--primary);color:var(--card);border-color:var(--primary)}
.hint{font-size:12px;color:var(--text3);margin-top:8px;line-height:1.6}
.hint b{color:var(--text2);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <h1>用量面板</h1>
  <div class="sub" id="subtitle">个人 API Key 用量与配额</div>
  <div id="app"><div class="center"><span class="spin"></span></div></div>
</div>
<script>
function fmt(n){return (n||0).toLocaleString()}
function fmtDate(s){if(!s)return '—';try{return new Date(s).toLocaleString()}catch(e){return s}}
function periodLabel(p){return p==='daily'?'每日':p==='monthly'?'每月':'总量'}

function getKey(){
  const h = location.hash.replace(/^#\/?/,'').trim();
  if(h){ const m = h.match(/(?:^|&)k(?:ey)?=([^&]+)/); return m ? decodeURIComponent(m[1]) : decodeURIComponent(h); }
  return new URLSearchParams(location.search).get('key') || '';
}

async function load(key){
  const app = document.getElementById('app');
  const res = await fetch('/v0/usage/me', {headers:{Authorization:'Bearer '+key}});
  if(res.status===401||res.status===403){
    app.innerHTML = '<div class="err">链接无效或 Key 不存在，请核对链接是否完整。</div>' + keyInput();
    return;
  }
  if(!res.ok){ app.innerHTML = '<div class="err">查询失败（'+res.status+'），请稍后重试。</div>'; return; }
  const d = await res.json();
  document.getElementById('subtitle').textContent = d.name ? d.name+' 的 API Key 用量与配额' : '个人 API Key 用量与配额';

  const u = d.usage||{}, q = d.quota||{};
  const modelPerms = await resolveModels(key, d, u);
  const limit = q.token_limit||0;
  const periodUsed = u.period_tokens||0;
  const pct = limit>0 ? Math.min(100, Math.round(periodUsed/limit*100)) : 0;
  const barCls = limit>0 && pct>=100 ? 'over' : pct>=80 ? 'warn' : '';
  const statusTag = d.disabled ? '<span class="tag bad">已禁用</span>'
    : d.expired ? '<span class="tag bad">已过期</span>'
    : '<span class="tag ok">正常</span>';

  let html = '<div class="card"><div class="grid">'
    + stat('累计 Token', fmt(u.total_tokens), fmt(u.requests||0)+' 次请求')
    + stat('本周期用量', fmt(periodUsed), periodLabel(q.period)+'限额 '+(limit>0?fmt(limit):'不限'))
    + stat('请求成功率', (u.requests>0?Math.round((1-(u.failed||0)/u.requests)*100):100)+'%', '失败 '+fmt(u.failed||0)+' 次')
    + stat('当前速率', ((u.rates&&u.rates.output_tokens_per_second)||0).toFixed(1)+' tok/s', ((u.rates&&u.rates.requests_per_second)||0).toFixed(2)+' 次/s · 近 60s')
    + stat('最近使用', u.last_used_at?fmtDate(u.last_used_at):'从未使用', '')
    + '</div>';
  if(limit>0){
    html += '<div style="margin-top:18px"><div class="row" style="border:none;padding:0"><span class="k">'+periodLabel(q.period)+'额度</span><span class="v">'+fmt(periodUsed)+' / '+fmt(limit)+'（'+pct+'%）</span></div><div class="bar '+barCls+'"><i style="width:'+pct+'%"></i></div></div>';
  }
  html += '</div>';

  html += '<div class="card"><h2>Key 信息</h2>'
    + row('名称', d.name||'—')
    + row('Key', '<code>'+(d.key_prefix||'')+'…</code>')
    + row('状态', statusTag)
    + row('过期时间', fmtDate(d.expires_at))
    + row('可用模型', modelLabel(modelPerms.allow));
  const rl = d.effective_rate_limit||{};
  const segs = [];
  if(rl.rpm>0)segs.push(fmt(rl.rpm)+' 次/分');
  if(rl.tpm>0)segs.push(fmt(rl.tpm)+' tokens/分');
  if(rl.rpd>0)segs.push(fmt(rl.rpd)+' 次/天');
  if(rl.max_concurrency>0)segs.push('并发 '+fmt(rl.max_concurrency));
  html += row('速率限制', segs.length?segs.join(' · '):'不限');
  if(rl.avg_latency_ms!==undefined||u.avg_latency_ms){
    html += row('平均延迟', (u.avg_latency_ms||0)+' ms'+(u.avg_ttft_ms?' · 首token '+u.avg_ttft_ms+' ms':''));
  }
  if(d.group){
    const g = d.group;
    const gu = g.usage||{};
    html += row('所属分组', g.name)
      + row('分组限额', '并发 '+(g.max_concurrency>0?g.max_concurrency:'不限')+' · '+(g.rate_limit_rpm>0?g.rate_limit_rpm+' 次/分':'不限速'))
      + row('分组累计用量', fmt(gu.total_tokens)+' tokens / '+fmt(gu.requests)+' 次请求');
  }
  html += '</div>';

  const models = u.models||{};
  const modelRows = Object.keys(models).map(k=>({m:k,...models[k]})).sort((a,b)=>b.tokens-a.tokens);
  if(modelRows.length){
    html += '<div class="card"><h2>分模型用量</h2>'
      + modelRows.slice(0,20).map(r=>row('<code>'+r.m+'</code>', fmt(r.tokens)+' tokens / '+fmt(r.requests)+' 次'+(r.failed?' · 失败 '+fmt(r.failed):''))).join('')
      + '</div>';
  }
  const daily = u.daily||{};
  const days = Object.keys(daily).sort().slice(-14);
  if(days.length){
    const maxT = Math.max.apply(null, days.map(k=>daily[k].tokens||0).concat([1]));
    html += '<div class="card"><h2>近 14 天用量</h2>'
      + days.map(k=>{const dd=daily[k];const p=Math.round((dd.tokens||0)/maxT*100);
        return '<div class="row"><span class="k">'+k+'</span><span class="v">'+fmt(dd.tokens)+' tokens / '+dd.requests+' 次</span></div><div class="bar"><i style="width:'+p+'%"></i></div>'}).join('')
      + '</div>';
  }

  html += configCard(key, modelPerms.ids);

  html += '<div class="muted" style="font-size:12px;text-align:center">数据每 15 秒刷新一次 · 请妥善保管本链接，它包含你的 Key</div>';
  app.innerHTML = html;
  activateTabs();
}
function stat(label,value,extra){return '<div class="stat"><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="extra">'+extra+'</div></div>'}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}

/* ---------- 接入配置 ---------- */

const COMPAT = {
  supportsStore: false,
  supportsDeveloperRole: false,
  supportsReasoningEffort: true,
  supportsUsageInStreaming: true,
  supportsStrictMode: false,
  maxTokensField: 'max_tokens',
  thinkingFormat: 'openai'
};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function yamlStr(v){return '"'+String(v).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"'}

// 一个模型必须同时通过 key 白名单与分组白名单（空列表=不限），与鉴权侧一致。
function allowsModel(list, id){
  if(!list || !list.length) return true;
  return list.some(pat => pat === '*' || pat === id || (pat.slice(-1) === '*' && id.indexOf(pat.slice(0,-1)) === 0));
}

function modelAllow(d){
  const key = Array.isArray(d.allowed_models) ? d.allowed_models.filter(Boolean) : [];
  const group = (d.group && Array.isArray(d.group.allowed_models)) ? d.group.allowed_models.filter(Boolean) : [];
  return {key: key, group: group, restricted: key.length > 0 || group.length > 0};
}

function modelLabel(allow){
  if(!allow.restricted) return '全部';
  const list = Array.from(new Set(allow.key.concat(allow.group)));
  return list.length ? esc(list.join(', ')) : '全部';
}

async function fetchCatalog(key){
  try{
    const res = await fetch(location.origin+'/v1/models', {headers:{Authorization:'Bearer '+key}});
    if(!res.ok) return [];
    const j = await res.json();
    return (j.data||[]).map(m=>m&&m.id).filter(Boolean);
  }catch(e){ return []; }
}

// /v1/models 返回全量目录，所以按该 Key 的有效权限再过滤一次；拿不到目录时
// 退回白名单里的具体条目（通配符无法展开，只能省去）。
async function resolveModels(key, d, u){
  const allow = modelAllow(d);
  const catalog = await fetchCatalog(key);
  const permitted = catalog.filter(id => allowsModel(allow.key, id) && allowsModel(allow.group, id));
  if(permitted.length) return {ids: permitted.slice(0,12), allow: allow};
  const flat = Array.from(new Set(allow.key.concat(allow.group))).filter(m => m.indexOf('*') < 0);
  if(flat.length) return {ids: flat.slice(0,12), allow: allow};
  const used = Object.keys((u&&u.models)||{});
  return {ids: used.slice(0,8), allow: allow};
}

function codeBlock(id, text, label){
  return '<div class="codeblock"><button class="copy" onclick="copyEl(\''+id+'\',this)">'+(label||'复制')+'</button>'
    + '<pre id="'+id+'">'+esc(text)+'</pre></div>';
}

function copyEl(id, btn){
  const el = document.getElementById(id);
  if(!el) return;
  const text = el.textContent;
  const ok = ()=>{const old = btn.textContent; btn.textContent = '已复制'; setTimeout(()=>{btn.textContent = old}, 1500)};
  const fallback = ()=>{
    const area = document.createElement('textarea');
    area.value = text; area.setAttribute('readonly','');
    area.style.position = 'fixed'; area.style.opacity = '0';
    document.body.appendChild(area); area.select(); area.setSelectionRange(0, area.value.length);
    let done = false; try{done = document.execCommand('copy')}catch(e){}
    area.remove();
    if(done){ok()}else{btn.textContent = '请手动复制'; setTimeout(()=>{btn.textContent = '复制'}, 2000)}
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(ok).catch(fallback);
  }else{
    fallback();
  }
}

function configCard(key, models){
  const base = location.origin.replace(/\/+$/,'');
  const openaiBase = base + '/v1';
  const list = models.length ? models : ['your-model-id'];
  const first = list[0];

  const piConfig = {
    providers: {
      cpa: {
        name: 'CLIProxyAPI',
        baseUrl: openaiBase,
        api: 'openai-completions',
        apiKey: key,
        compat: COMPAT,
        models: list.map(id=>({id: id}))
      }
    }
  };
  const piDefaults = {defaultProvider: 'cpa', defaultModel: first};

  const ompConfig = ['providers:', '  cpa:', '    baseUrl: '+openaiBase, '    apiKey: '+yamlStr(key),
    '    api: openai-completions', '    compat:', '      supportsStore: false',
    '      supportsDeveloperRole: false', '      supportsReasoningEffort: true',
    '      maxTokensField: max_tokens', '      thinkingFormat: openai', '    models:']
    .concat(list.map(id=>'      - id: '+id)).join('\n');
  const ompDefaults = ['defaultProvider: cpa', 'defaultModel: '+first].join('\n');

  const claudeConfig = {
    env: {
      ANTHROPIC_BASE_URL: base,
      ANTHROPIC_AUTH_TOKEN: key,
      ANTHROPIC_MODEL: first,
      ANTHROPIC_SMALL_FAST_MODEL: list[1] || first
    }
  };

  const placeholderNote = models.length ? '' :
    '<div class="hint">未能自动获取模型列表，请把 <b>your-model-id</b> 换成你要用的模型名（见上方「可用模型」一行）。</div>';

  const panels = [
    {
      id: 'pi', label: 'pi',
      title: 'pi',
      install: 'npm install -g --ignore-scripts @earendil-works/pi-coding-agent',
      blocks: [
        ['pi-models', JSON.stringify(piConfig, null, 2), '写入 <code>~/.pi/agent/models.json</code>（新建，或合并进已有 <code>providers</code>）'],
        ['pi-settings', JSON.stringify(piDefaults, null, 2), '可选：写入 <code>~/.pi/agent/settings.json</code>，设为启动默认模型']
      ]
    },
    {
      id: 'omp', label: 'omp',
      title: 'omp (oh-my-pi)',
      install: 'curl -fsSL https://omp.sh/install | sh',
      blocks: [
        ['omp-models', ompConfig, '写入 <code>~/.omp/agent/models.yml</code>（新建，或合并进已有 <code>providers</code>）'],
        ['omp-config', ompDefaults, '可选：写入 <code>~/.omp/agent/config.yml</code>，设为启动默认模型']
      ]
    },
    {
      id: 'claude', label: 'Claude Code',
      title: 'Claude Code',
      install: 'npm install -g @anthropic-ai/claude-code',
      blocks: [
        ['claude-settings', JSON.stringify(claudeConfig, null, 2), '写入 <code>~/.claude/settings.json</code>（合并进已有 <code>env</code>；也可改用同名环境变量）']
      ]
    }
  ];

  let html = '<div class="card"><h2>接入配置</h2>'
    + '<div class="hint" style="margin-top:-4px;margin-bottom:14px">已自动填入你的 Key 和本服务地址，复制即可使用。安装好 agent 后，把对应配置写进文件，重启 agent 生效。</div>'
    + '<div class="tabs">'
    + panels.map((p,i)=>'<button data-tab="'+p.id+'"'+(i===0?' class="active"':'')+'>'+esc(p.label)+'</button>').join('')
    + '</div>';

  panels.forEach((p,i)=>{
    html += '<div class="tabpanel" data-panel="'+p.id+'"'+(i===0?'':' style="display:none"')+'>'
      + '<div class="step">1. 安装 <code>'+esc(p.title)+'</code></div>'
      + codeBlock('cmd-'+p.id, p.install)
      + p.blocks.map((b,j)=>'<div class="step">'+(j+2)+'. '+b[2]+'</div>'+codeBlock(b[0], b[1])).join('')
      + (p.id==='claude'
          ? '<div class="hint">Claude Code 走 <b>/v1/messages</b>（Anthropic 协议），本服务已自动翻译到上游；<b>ANTHROPIC_AUTH_TOKEN</b> 会作为 <code>Authorization: Bearer</code> 发送。</div>'
          : '<div class="hint">pi / omp 走 <b>/v1/chat/completions</b>（OpenAI 协议）。首次启动后用 <code>/model</code> 选择模型；若上面填了默认模型，直接运行即可。</div>')
      + '</div>';
  });

  html += placeholderNote + '</div>';
  return html;
}

function activateTabs(){
  document.querySelectorAll('.tabs button').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.tab;
      document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active', b===btn));
      document.querySelectorAll('[data-panel]').forEach(p=>{p.style.display = p.dataset.panel===id ? '' : 'none'});
    };
  });
}

function keyInput(){
  return '<div class="center"><p class="muted" style="margin-bottom:14px">手动输入你的 API Key 查看用量：</p>'
    + '<input type="text" id="kinput" placeholder="sk-cpa-..."> '
    + '<button onclick="location.hash=document.getElementById(\'kinput\').value.trim();location.reload()">查询</button></div>';
}

const key = getKey();
if(!key){
  document.getElementById('app').innerHTML = keyInput();
}else{
  load(key).catch(()=>{document.getElementById('app').innerHTML='<div class="err">网络错误，请稍后重试。</div>'});
}
</script>
</body>
</html>
